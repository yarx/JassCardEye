name: web

# The project website under src/web - Angular, every page prerendered to plain HTML - on the Azure Static
# Web App jasscardeye-web (Free), reachable as jasscardeye.yarx.ch. A pull request only builds it; a push
# to main builds and publishes. A run started by hand publishes only on main and just builds anywhere
# else, so no branch can go live. See src/web/README.md.
on:
  push:
    branches: [main]
    paths: ['src/web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['src/web/**', '.github/workflows/web.yml']
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🌐 Build and publish the website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/web
    steps:
      - name: 📥 Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🧰 Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: 📦 Install
        run: npm ci

      # Every language is built and prerendered: a message missing in one of them, a language without all
      # of its pages, or a translation that still carries a message the site dropped stops the build.
      - name: 🏗️ Build and prerender every language
        run: npm run build

      # The German messages the translations follow have to be the ones in the code. Extracted again and
      # compared, so a new or changed message cannot reach main without its translations being asked for.
      - name: 🔤 Check the extracted messages
        run: |
          set -euo pipefail
          npx ng extract-i18n --format json --output-path src/locale
          git diff --exit-code -- src/locale/messages.json || {
            echo "::error file=src/web/src/locale/messages.json::Out of date - run npx ng extract-i18n --format json --output-path src/locale in src/web and translate the change."
            exit 1
          }

      # main only: a pull request's ref is refs/pull/<n>/merge, and a run by hand carries its branch.
      # Pinned to a commit, because this step holds the site's deployment token: a tag or a branch can
      # be moved to other code, a commit cannot. v1 is a branch in that repository. To update, look its
      # commit up again and replace it.
      - name: 🚀 Publish to Azure Static Web Apps
        if: github.ref == 'refs/heads/main'
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WEB }}
          action: upload
          app_location: src/web/dist/jasscardeye-web/browser
          skip_app_build: true
          skip_api_build: true
